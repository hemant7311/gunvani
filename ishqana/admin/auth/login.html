<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

/* BACKGROUND */
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffffff,#4b0d0d);
}

/* CONTAINER */
.login-container{
    display:flex;
    width:800px;
    max-width:95%;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

/* LEFT SIDE */
.login-left{
    width:50%;
    background:linear-gradient(135deg,#4b0d0d,#2b0f0f);
    color:#fff;
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.login-left h1{
    font-size:28px;
    margin-bottom:10px;
}

.login-left p{
    opacity:0.8;
    font-size:14px;
}

/* RIGHT SIDE */
.login-right{
    width:50%;
    padding:40px;
}

.login-right h2{
    margin-bottom:25px;
    color:#2b0f0f;
}

/* INPUT */
.input-box{
    margin-bottom:15px;
}

.input-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    transition:0.3s;
}

.input-box input:focus{
    border-color:#f4a940;
    box-shadow:0 0 6px rgba(244,169,64,0.5);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#f4a940;
    color:#fff;
    font-weight:500;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#ffb84d;
}

/* FOOTER */
.footer{
    text-align:center;
    font-size:12px;
    margin-top:15px;
    color:#777;
}

/* MOBILE */
@media(max-width:768px){
    .login-container{
        flex-direction:column;
    }
    .login-left{
        width:100%;
        text-align:center;
    }
    .login-right{
        width:100%;
    }
}

</style>
</head>

<body>

<div class="login-container">

    <!-- LEFT SIDE -->
    <div class="login-left">
        <h1>Ishqana Admin</h1>
        <p>Manage your orders, products and dashboard easily with secure access.</p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="login-right">

        <h2>Admin Login</h2>

        <form action="login.php" method="POST">

            <div class="input-box">
                <input type="email" name="email" placeholder="Enter Email" required>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit">Login</button>

        </form>

        <div class="footer">
            © 2026 Ishqana Admin Panel
        </div>

    </div>

</div>

</body>
</html>
